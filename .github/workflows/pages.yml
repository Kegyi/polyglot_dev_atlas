name: Upload output preview artifact

on:
  push:
    branches: ["main"]
    paths:
      - "output/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure output exists
        run: |
          test -f output/polyglot_dev_atlas.html

      - name: Upload output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: polyglot-dev-atlas-site
          path: output
          if-no-files-found: error
          retention-days: 30
